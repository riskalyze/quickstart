on:
  pull_request:

name: Lint

jobs:
  shellcheck:
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64
    permissions:
      contents: read
    steps:
      - uses: runs-on/action@v2.7.0
      - uses: actions/checkout@v7
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
